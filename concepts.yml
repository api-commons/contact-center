context: contact-center
name: Contact Center
intro: >-
  The common contact-center vocabulary -- the queues that hold waiting customers, the
  interactions routed through them, the skills that decide who takes them, the states agents
  are in and the dispositions recorded when they finish -- distilled from the APIs that
  already exist. Agents belong to the help-desk context and calls to telephony.
tags: [Contact Center, Call Center, CCaaS, Contact Center as a Service, Workforce Engagement, Customer Engagement]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, entities, pageSize, pageNumber]


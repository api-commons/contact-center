  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, date_modified_ts]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, routing_status, presence, availability]
  name: [title, display_name, label]
  description: [notes, note, details]
  agent_id: [agent, user_id, user, assignee_id, member_id]

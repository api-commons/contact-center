    segments: [queues, queue, call_queues, call-queues, callqueues, routing_queues, skill_groups, hunt_groups, ring_groups, workgroups]
    aliases:
      member_ids: [members, agents, users, agent_ids]
      routing_strategy: [routing_method, distribution, strategy, acd_skill_evaluation_method]
      max_wait: [max_wait_time, timeout, max_queue_time]
  # interaction, skill, agent_state and disposition were measured and dropped: 3, 3, 3 and 1
  # providers -- Genesys alone exposes all four, and one vendor's shape is not a common one.

duplicates:
  khoros-ai: [lithium]
  quo: [openphone]

findings:
  - "Contact center is the thinnest context in the commons. Queues agree on id, name and
    created_at across ten CPaaS and business-phone providers; every other concept is exposed
    by three providers or fewer, and Genesys is the only platform that publishes all of them."
  - "The major contact-center platforms are largely absent: of Amazon Connect, Five9, NICE and
    Talkdesk, none has harvested OpenAPI in this cohort."
decisions:
  - "Only queues are published. Interactions, skills, agent states and dispositions were measured
    and dropped: with Genesys the only full publisher, their 'common' shape would be one
    vendor's."
  - "Agents are the help-desk context's and calls telephony's; neither is duplicated."
  - "Call queues, hunt groups, ring groups and workgroups are queues."
